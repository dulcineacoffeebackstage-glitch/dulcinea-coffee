<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杜辛亞咖啡 Dulcinea · 咖啡豆訂購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* 白色系層次 */
    --white:#FFFFFF;
    --paper-50:#FEFEFD;
    --paper-100:#FAFAF8;
    --paper-200:#F3F2EE;
    --paper-300:#E8E7E2;
    --line:#E6E5E0;
    /* 文字 */
    --ink:#1A1A1A;
    --ink-soft:#6B6B66;
    --ink-mute:#ADADA8;
    /* 重點色 */
    --gold:#1A1A1A;
    --gold-deep:#000000;
    --wood:#4A4A45;
    --ok:#5C7A5C;
    --alert:#B0604C;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(120% 60% at 50% 0%, #FFFFFF 0%, var(--paper-100) 55%, var(--paper-200) 100%)
      fixed;
    color:var(--ink);
    font-family:'Noto Sans TC',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:660px;margin:0 auto;padding:0 20px 96px;}

  /* ---------- 頁首 ---------- */
  header.hero{
    background:linear-gradient(168deg,#FFFFFF 0%, var(--paper-50) 48%, var(--paper-200) 100%);
    border-bottom:1px solid var(--line);
    padding:44px 20px 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:'';position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
    width:120px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .logo-mark{
    display:block;width:auto;height:64px;margin:0 auto 16px;
    opacity:.88;
  }
  @media (prefers-reduced-motion: no-preference){
    .logo-mark{animation:logoRise .8s cubic-bezier(.2,.7,.3,1) both;}
    @keyframes logoRise{
      from{opacity:0;transform:translateY(8px) scaleY(.9);transform-origin:bottom;}
      to{opacity:1;transform:none;}
    }
  }
  .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold-deep);margin:0 0 12px;
  }
  h1.brand{
    font-family:'Noto Serif TC',serif;
    font-size:30px;letter-spacing:.14em;font-weight:500;
    margin:0 0 12px;color:var(--ink);
  }
  header.hero p.tagline{
    margin:0 auto;font-size:14px;line-height:1.75;color:var(--ink-soft);max-width:34ch;
  }
  .enc-link{
    display:inline-block;margin-top:16px;
    font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.04em;
    color:var(--gold-deep);text-decoration:none;
    border-bottom:1px solid var(--gold);padding-bottom:2px;
  }
  .enc-link:hover{color:var(--wood);border-color:var(--wood);}

  /* ---------- 區塊 ---------- */
  section{padding:34px 0;border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}
  h2.section-title{
    font-family:'Noto Serif TC',serif;
    font-size:14px;letter-spacing:.1em;text-transform:uppercase;
    margin:0 0 18px;color:var(--ink);
    display:flex;align-items:center;gap:10px;
  }
  h2.section-title::before{
    content:'';width:16px;height:2px;background:var(--gold);flex-shrink:0;
  }

  /* ---------- 風味護照 ---------- */
  :root{
    --pp-cover-1:#FDFCFA; --pp-cover-2:#F3F2EE;
    --pp-stamp-region:#3A4A56; --pp-stamp-flavor:#6B3F3A;
    --pp-stamp-roast:#5A4A3A; --pp-stamp-process:#435A45;
  }
  .passport{position:relative;}
  .pp-book{
    max-width:560px;margin:0 auto;
    perspective:1800px;
  }

  /* ---- 封面（闔起） ---- */
  .pp-cover{
    position:relative;border-radius:8px;padding:18px 18px 34px;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;text-align:center;cursor:pointer;
    background:
      radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(155deg, var(--pp-cover-1) 0%, var(--pp-cover-2) 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 18px 34px -20px rgba(26,26,26,.18);
    border:1px solid var(--ink);
    transition:transform .25s ease;
  }
  .pp-cover:active{transform:scale(.985);}
  .pp-cover::before{
    content:'';position:absolute;inset:14px;
    border:1px solid rgba(26,26,26,.22);border-radius:4px;pointer-events:none;
  }
  .pp-cover-photo{position:relative;width:100%;margin-bottom:18px;}
  .pp-cover-photo img{
    display:block;width:100%;height:auto;
    border:1px solid rgba(26,26,26,.35);border-radius:2px;
  }
  .pp-cover-stamp{
    position:absolute;right:-6px;bottom:-16px;width:92px;height:92px;border-radius:50%;
    transform:rotate(-11deg);mix-blend-mode:multiply;opacity:.85;
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .pp-cover-stamp::before{
    content:'';position:absolute;inset:0;border-radius:50%;border:1.4px solid var(--ink);
  }
  .pp-cover-stamp::after{
    content:'';position:absolute;inset:6px;border-radius:50%;border:1px dashed var(--ink);
  }
  .pp-cover-stamp-text{
    position:relative;text-align:center;padding:0 8px;
    font-family:'Cormorant Garamond',serif;color:var(--ink);
  }
  .pp-cover-stamp-text .l1{display:block;font-size:6.5px;letter-spacing:1.4px;}
  .pp-cover-stamp-text .l2{display:block;font-family:'Noto Serif TC',serif;font-weight:500;font-size:9px;letter-spacing:1px;margin:3px 0;}
  .pp-cover-stamp-text .l3{display:block;font-size:6px;letter-spacing:1.2px;}
  .pp-cover .logo-mark{height:38px;opacity:.95;margin-bottom:12px;}
  .pp-cover-eyebrow{
    font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--gold);opacity:.85;margin:0 0 12px;
  }
  .pp-cover-title{
    font-family:'Noto Serif TC',serif;font-weight:300;font-size:26px;letter-spacing:.12em;
    color:var(--ink);margin:0 0 10px;
  }
  .pp-cover-sub{
    font-family:'Cormorant Garamond',serif;font-size:11.5px;letter-spacing:.1em;
    color:rgba(26,26,26,.55);margin:0;
  }
  .pp-cover-hint{
    margin-top:16px;font-size:12.5px;color:rgba(26,26,26,.5);
    font-family:'Cormorant Garamond',serif;letter-spacing:.04em;
  }
  .pp-cover-hint::after{content:' →';}

  /* ---- 開啟前：輸入電話 ---- */
  .pp-gate{padding:18px 4px 4px;text-align:center;}
  .pp-lead{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}
  .pp-form{display:flex;gap:8px;max-width:320px;margin:0 auto;}
  .pp-form input{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
    background:var(--white);font-family:inherit;font-size:14px;text-align:center;
  }
  .pp-form input:focus{outline:none;border-color:var(--gold);}
  .pp-note{margin:10px 0 0;font-size:11.5px;color:var(--ink-mute);line-height:1.6;}
  .pp-err{margin:8px 0 0;font-size:12px;color:var(--alert);}

  /* ---- 開啟後：護照本 ---- */
  .pp-open{
    background:linear-gradient(160deg,#FFFFFF 0%, var(--paper-50) 55%, var(--paper-200) 100%);
    border:1px solid var(--line);border-radius:5px;overflow:hidden;
    box-shadow:0 10px 26px -18px rgba(43,42,40,.35);
  }
  .pp-tabs{
    display:flex;overflow-x:auto;gap:2px;padding:10px 10px 0;
    background:var(--paper-200);border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .pp-tabs::-webkit-scrollbar{display:none;}
  .pp-tab{
    flex:none;padding:11px 15px 12px;font-size:12.5px;white-space:nowrap;cursor:pointer;
    font-family:'Cormorant Garamond',serif;letter-spacing:.03em;color:var(--ink-mute);
    border-radius:5px 5px 0 0;position:relative;top:1px;
    border:1px solid transparent;border-bottom:none;
  }
  .pp-tab.active{
    color:var(--ink);background:var(--paper-50);border-color:var(--line);
    font-weight:600;
  }
  .pp-tab-icon{margin-right:6px;font-size:13px;}
  .pp-page{padding:28px 28px 26px;min-height:220px;position:relative;perspective:1400px;}
  .pp-page::before{
    content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;
    background:linear-gradient(180deg,transparent,var(--line) 15%,var(--line) 85%,transparent);
    opacity:.6;pointer-events:none;
  }
  .pp-page-inner{transform-origin:left center;}
  @keyframes ppFlip{
    0%{transform:rotateY(-92deg);opacity:0;}
    55%{transform:rotateY(8deg);opacity:1;}
    100%{transform:rotateY(0deg);opacity:1;}
  }
  .pp-flip .pp-page-inner{animation:ppFlip .5s cubic-bezier(.2,.7,.3,1) both;}

  .pp-nav-row{
    display:flex;justify-content:space-between;gap:10px;padding:0 22px 16px;
  }
  .pp-nav-btn{
    flex:1;background:var(--white);border:1px solid var(--line);border-radius:20px;
    padding:9px 14px;font-family:'Cormorant Garamond',serif;font-size:11.5px;
    color:var(--ink-soft);cursor:pointer;text-align:center;
  }
  .pp-nav-btn:hover{border-color:var(--gold);color:var(--gold-deep);}
  .pp-nav-btn.next{text-align:center;}

  /* ---- 當日驚喜 ---- */
  .pp-surprise{text-align:center;padding:10px 0 4px;}
  .pp-surprise-icon{font-size:56px;line-height:1;margin-bottom:16px;}
  .pp-surprise-title{
    font-family:'Noto Serif TC',serif;font-size:20px;color:var(--ink);margin:0 0 10px;
  }
  .pp-surprise-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.8;max-width:34ch;margin:0 auto;}
  .pp-surprise-tag{
    display:inline-block;margin-top:14px;font-family:'Cormorant Garamond',serif;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);
  }
  .pp-celebrate{
    margin:0 0 18px;padding:14px 16px;border-radius:4px;text-align:left;
    background:linear-gradient(180deg,#FAFAF8,#F0EFEA);border:1px solid var(--gold);
  }
  .pp-celebrate-title{
    font-family:'Noto Serif TC',serif;font-size:13.5px;color:var(--wood);margin:0 0 6px;
  }
  .pp-celebrate-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--ink-soft);padding:5px 0;
  }
  .pp-celebrate-code{
    font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold-deep);
    background:var(--white);border:1px dashed var(--gold);border-radius:3px;
    padding:3px 8px;cursor:pointer;
  }

  /* ---- 印章頁 ---- */
  .pp-stamp-intro{font-size:12px;color:var(--ink-mute);margin:0 0 16px;line-height:1.6;}
  .pp-stamps{display:flex;flex-wrap:wrap;gap:18px 20px;}
  .pp-stamp{
    width:100px;height:100px;border-radius:50%;flex-shrink:0;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px;
    border:2px solid var(--stamp-color);color:var(--stamp-color);
    background:radial-gradient(circle,rgba(255,255,255,0) 60%, var(--stamp-color) 230%);
    opacity:.42;filter:saturate(.7);
  }
  .pp-stamp::before{
    content:'';position:absolute;inset:5px;border:1px dashed var(--stamp-color);
    border-radius:50%;opacity:.6;
  }
  .pp-stamp.match{opacity:1;filter:none;}
  .pp-stamp-name{font-size:11.5px;line-height:1.3;font-weight:700;word-break:break-word;}
  .pp-stamp-count{
    position:absolute;top:-7px;right:-5px;min-width:20px;height:20px;border-radius:10px;
    background:var(--stamp-color);color:#fff;font-family:'Cormorant Garamond',serif;
    font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .pp-stamp-empty{font-size:13px;color:var(--ink-mute);padding:10px 0;}

  .pp-goal{
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  }
  .pp-goal-row{margin-bottom:12px;}
  .pp-goal-row:last-child{margin-bottom:0;}
  .pp-goal-name{
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:5px;
  }
  .pp-goal-name b{color:var(--ink);font-weight:600;}
  .pp-goal-bar{height:6px;border-radius:3px;background:var(--paper-300);overflow:hidden;}
  .pp-goal-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:3px;}
  .pp-goal-done{color:var(--ok);}

  /* ---- 會員專區 ---- */
  .pp-member-sec{margin-bottom:22px;}
  .pp-member-sec:last-child{margin-bottom:0;}
  .pp-member-title{
    font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--wood);margin-bottom:10px;
  }
  .pp-order-card{
    border:1px solid var(--line);border-radius:3px;padding:11px 13px;margin-bottom:8px;
    background:var(--white);
  }
  .pp-order-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-mute);margin-bottom:5px;}
  .pp-order-items{font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
  .pp-order-foot{
    display:flex;justify-content:space-between;margin-top:7px;padding-top:7px;
    border-top:1px solid var(--paper-200);font-size:12.5px;
  }
  .pp-badge{
    font-family:'Cormorant Garamond',serif;font-size:10px;padding:2px 7px;border-radius:10px;
    background:var(--paper-200);color:var(--ink-soft);
  }
  .pp-badge.已完成{background:#E7EFE7;color:var(--ok);}
  .pp-badge.待處理{background:#F7EBD3;color:var(--gold-deep);}
  .pp-badge.已出貨{background:#E4E8EA;color:var(--pp-stamp-region);}
  .pp-coupon-card{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    border:1px dashed var(--line);border-radius:3px;padding:10px 13px;margin-bottom:8px;
  }
  .pp-coupon-card.used{opacity:.5;}
  .pp-coupon-code{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--ink);}
  .pp-coupon-desc{font-size:11.5px;color:var(--ink-mute);margin-top:2px;}
  .pp-copy-btn{
    font-family:'Cormorant Garamond',serif;font-size:10.5px;color:var(--gold-deep);
    background:var(--paper-100);border:1px solid var(--line);border-radius:3px;
    padding:5px 9px;cursor:pointer;flex-shrink:0;
  }
  .pp-copy-btn:hover{border-color:var(--gold);}
  .pp-empty{font-size:13px;color:var(--ink-mute);line-height:1.8;margin:0;padding:6px 0;}

  .pp-foot-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 22px;border-top:1px solid var(--line);background:var(--paper-100);
  }
  .pp-reset{
    background:none;border:none;font-family:'Cormorant Garamond',serif;font-size:11px;
    color:var(--ink-mute);cursor:pointer;padding:0;text-decoration:underline;
  }
  .pp-reset:hover{color:var(--gold-deep);}
  .pp-enc{
    font-family:'Cormorant Garamond',serif;font-size:11px;color:var(--gold-deep);
    text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px;
  }
  .pp-enc:hover{color:var(--wood);border-color:var(--wood);}

  /* ---------- 豆單 ---------- */
  .bean{
    display:flex;gap:13px;align-items:flex-start;
    padding:17px 0;border-top:1px solid var(--line);
  }
  .bean:first-of-type{border-top:none;padding-top:2px;}
  .bean input[type=checkbox]{
    width:18px;height:18px;margin-top:3px;accent-color:var(--gold-deep);flex-shrink:0;cursor:pointer;
  }
  .bean-info{flex:1;min-width:0;}
  .bean-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .bean-name{font-weight:600;font-size:15px;}
  .bean-price{
    font-family:'Cormorant Garamond',serif;font-size:14px;white-space:nowrap;color:var(--ink);
  }
  .bean-meta{
    font-family:'Cormorant Garamond',serif;font-size:10.5px;color:var(--wood);
    margin:4px 0 6px;letter-spacing:.02em;
  }
  .bean-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.65;}
  .bean-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .tag{
    font-family:'Cormorant Garamond',serif;font-size:10px;line-height:1.6;
    padding:2px 8px;border-radius:2px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper-50),var(--paper-100));color:var(--wood);
  }
  .tag.roast{border-color:#DCCBA8;background:linear-gradient(180deg,#FFFDF8,#F7F0E2);color:var(--gold-deep);}
  .tag.region{border-color:#CFD8CF;background:linear-gradient(180deg,#FBFDFB,#EFF4EF);color:var(--ok);}
  .tag.other{border-color:#E0C4BC;background:linear-gradient(180deg,#FEFAF8,#FAEDE8);color:var(--alert);}

  .filter-bar{margin-bottom:18px;}
  .filter-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:9px;}
  .filter-label{
    font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-mute);min-width:44px;
  }
  .chip{
    font-size:12px;padding:5px 12px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#FFFFFF,var(--paper-50));color:var(--ink-soft);
    transition:background .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--gold);color:var(--gold-deep);}
  .chip.on{
    border-color:var(--gold-deep);color:var(--white);
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));
  }
  .filter-clear{
    background:none;border:none;font-family:'Cormorant Garamond',serif;font-size:11px;
    color:var(--ink-mute);cursor:pointer;padding:5px 4px;text-decoration:underline;
  }
  .filter-clear:hover{color:var(--gold-deep);}
  .filter-count{font-size:11.5px;color:var(--ink-mute);margin-top:2px;}
  .more-tags{
    background:none;border:none;font-family:'Cormorant Garamond',serif;font-size:11px;
    color:var(--gold-deep);cursor:pointer;padding:5px 8px;
  }
  .origin-link{
    font-family:'Cormorant Garamond',serif;font-size:10.5px;color:var(--gold-deep);
    margin-top:9px;cursor:pointer;display:inline-block;
  }
  .origin-link:hover{color:var(--wood);}
  .qty-row{display:flex;align-items:center;gap:9px;margin-top:11px;}
  .qty-btn{
    width:27px;height:27px;border:1px solid var(--line);
    background:linear-gradient(180deg,#FFFFFF,var(--paper-100));
    font-size:15px;cursor:pointer;color:var(--ink-soft);border-radius:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-btn:hover{border-color:var(--gold);color:var(--gold-deep);}
  .qty-val{font-family:'Cormorant Garamond',serif;font-size:13px;min-width:22px;text-align:center;}

  /* ---------- 表單 ---------- */
  .field{margin-bottom:15px;}
  label.field-label{
    display:block;font-size:10.5px;font-family:'Cormorant Garamond',serif;
    letter-spacing:.08em;text-transform:uppercase;color:var(--wood);margin:0 0 6px;
  }
  input[type=text],input[type=tel],textarea{
    width:100%;padding:11px 13px;
    border:1px solid var(--line);border-radius:2px;
    background:linear-gradient(180deg,#FFFFFF,var(--paper-50));
    font-family:inherit;font-size:14px;color:var(--ink);
  }
  input:focus,textarea:focus{outline:none;border-color:var(--gold);background:var(--white);}
  textarea{resize:vertical;min-height:62px;}

  .choice-group{display:flex;flex-direction:column;gap:8px;}
  .choice{
    border:1px solid var(--line);border-radius:2px;
    background:linear-gradient(180deg,#FFFFFF,var(--paper-50));
    padding:13px 15px;cursor:pointer;font-size:13.5px;
    display:flex;align-items:center;gap:10px;
  }
  .choice:hover{border-color:var(--gold);}
  .choice.active{
    border-color:var(--gold-deep);
    background:linear-gradient(180deg,#FFFDF8,#F7F0E2);
  }
  .choice .dot{
    width:14px;height:14px;border-radius:50%;border:1px solid var(--line);
    background:var(--white);flex-shrink:0;position:relative;
  }
  .choice.active .dot{border-color:var(--gold-deep);}
  .choice.active .dot::after{
    content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold-deep);
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
let products = [];
let payments = [];
let qty = {};
let delivery = 'pickup';
let payMethod = null;
let appliedCoupon = null;

/* ---------- 啟動 ---------- */
async function init(){
  if(!isConfigured()){
    document.getElementById('formView').innerHTML =
      `<div class="setup-warn">${configWarning()}</div>`;
    return;
  }
  renderPassportClosed();
  await Promise.all([loadProducts(), loadPayments()]);
}

let tags = [];          // 所有標籤
let tagMap = {};         // 商品 id → 標籤陣列
let activeFilters = new Set();
let showAllFlavors = false;

async function loadTags(){
  const [tagRes, linkRes] = await Promise.all([
    sb.from('tags').select('*').order('kind').order('sort_order'),
    sb.from('product_tags').select('*')
  ]);
  if(tagRes.error || linkRes.error) return;      // 還沒建立標籤表就略過，不影響下單
  tags = tagRes.data || [];
  const byId = Object.fromEntries(tags.map(t => [t.id, t]));
  tagMap = {};
  (linkRes.data || []).forEach(l => {
    const t = byId[l.tag_id];
    if(!t) return;
    (tagMap[l.product_id] = tagMap[l.product_id] || []).push(t);
  });

  // 只留掛著「線上商店」通路的商品。
  // 沒有建立 channel 標籤時就全部顯示，避免舊資料整頁空白。
  const online = tags.find(t => t.kind === 'channel' && t.name === '線上商店');
  if(online){
    const allowed = new Set(
      (linkRes.data || []).filter(l => l.tag_id === online.id).map(l => l.product_id)
    );
    if(allowed.size) products = products.filter(p => allowed.has(p.id));
  }

  renderFilters();
}

/* 通路與菜單分類是後台用的，不拿來當客人的篩選條件 */
function isFilterKind(kind){
  return ['roast','region','process','flavor'].includes(kind);
}

/* 只顯示「目前商品實際用到」的標籤，避免出現按了沒東西的選項 */
function usedTags(kind){
  const used = new Set();
  products.forEach(p => (tagMap[p.id] || []).forEach(t => { if(t.kind === kind) used.add(t.id); }));
  return tags.filter(t => used.has(t.id));
}

function renderFilters(){
  const bar = document.getElementById('filterBar');
  const groups = [
    { kind:'roast',   label:'烘焙' },
    { kind:'region',  label:'產區' },
    { kind:'process', label:'處理' },
    { kind:'flavor',  label:'風味' },
  ];
  let html = '';
  groups.forEach(g => {
    let list = usedTags(g.kind);
    if(!list.length) return;
    let extra = '';
    if(g.kind === 'flavor' && !showAllFlavors && list.length > 8){
      extra = `<button class="more-tags" onclick="showAllFlavors=true;renderFilters()">
                 更多 ${list.length - 8} 種風味 ▾</button>`;
      list = list.slice(0, 8);
    }
    html += `<div class="filter-group">
      <span class="filter-label">${g.label}</span>
      ${list.map(t => `<span class="chip ${activeFilters.has(t.id)?'on':''}"
        onclick="toggleFilter(${t.id})">${esc(t.name)}</span>`).join('')}
      ${extra}
    </div>`;
  });
  if(activeFilters.size){
    html += `<button class="filter-clear" onclick="clearFilters()">清除篩選（${activeFilters.size}）</button>`;
  }
  bar.innerHTML = html;
}
function toggleFilter(id){
  activeFilters.has(id) ? activeFilters.delete(id) : activeFilters.add(id);
  renderFilters(); renderBeans();
}
function clearFilters(){
  activeFilters.clear();
  renderFilters(); renderBeans();
}
/* 篩選規則：同一類標籤之間是「或」，不同類之間是「且」。
   例如選了「淺焙」＋「非洲產區」＋「花香」＋「莓果」，
   會找出：淺焙 且 非洲 且（花香 或 莓果）的豆子。 */
function matchFilters(p){
  if(!activeFilters.size) return true;
  const own = (tagMap[p.id] || []);
  const byKind = {};
  activeFilters.forEach(id => {
    const t = tags.find(x => x.id === id);
    if(t) (byKind[t.kind] = byKind[t.kind] || []).push(id);
  });
  return Object.values(byKind).every(ids => ids.some(id => own.some(t => t.id === id)));
}

async function loadProducts(){
  const { data, error } = await sb.from('products')
    .select('*').eq('active', true).order('sort_order');
  if(error){
    document.getElementById('beanList').innerHTML =
      `<div class="empty-note">豆單載入失敗：${error.message}</div>`;
    return;
  }
  products = data || [];
  await loadTags();
  renderBeans();
}

async function loadPayments(){
  const { data, error } = await sb.from('payment_methods')
    .select('*').eq('enabled', true).order('sort_order');
  if(error){
    document.getElementById('payList').innerHTML =
      `<div class="empty-note">付款方式載入失敗：${error.message}</div>`;
    return;
  }
  payments = data || [];
  if(payments.length) payMethod = payments[0].id;
  renderPayments();
}

/* ---------- 風味護照 ---------- */
let ppData = null, ppSurprise = null, ppMember = null, ppPhone = '', ppTab = 'surprise';

function normPhone(s){ return String(s || '').replace(/\D/g, ''); }

function renderPassportClosed(){
  ppData = null; ppSurprise = null; ppMember = null; ppPhone = '';
  document.getElementById('ppBook').innerHTML = `
    <div class="pp-cover" onclick="document.getElementById('ppPhoneInput').focus()">
      <div class="pp-cover-photo">
        <img src="cijin-harbor.jpg" alt="高雄旗津">
        <div class="pp-cover-stamp">
          <span class="pp-cover-stamp-text">
            <span class="l1">KAOHSIUNG</span>
            <span class="l2">入境 ENTRY</span>
            <span class="l3">CIJIN PORT</span>
          </span>
        </div>
      </div>
      <img class="logo-mark" src="logo-dulcinea.png" alt="">
      <p class="pp-cover-eyebrow">Dulcinea Passport</p>
      <h3 class="pp-cover-title">風味護照</h3>
      <p class="pp-cover-sub">WHERE THERE IS COFFEE, THERE IS A WAY.</p>
      <p class="pp-cover-hint">點擊翻開</p>
    </div>
    <div class="pp-gate">
      <p class="pp-lead">留下電話，翻開屬於你的風味護照。</p>
      <div class="pp-form">
        <input type="tel" id="ppPhoneInput" placeholder="0912-345-678"
               onkeydown="if(event.key==='Enter') openPassport()">
        <button type="button" class="btn-apply" onclick="openPassport()">翻開護照</button>
      </div>
      <p class="pp-note">只會顯示累積次數，不會顯示訂單內容。第一次訂購的話還沒有紀錄。</p>
      <p class="pp-err" id="ppErr" style="display:none;"></p>
    </div>`;
}

async function openPassport(phoneOverride){
  const input = document.getElementById('ppPhoneInput');
  const phone = normPhone(phoneOverride || (input ? input.value : ''));
  const errEl = document.getElementById('ppErr');

  if(phone.length < 8){
    if(!phoneOverride && errEl){ errEl.textContent = '請輸入完整的電話號碼。'; errEl.style.display = 'block'; }
    return;
  }
  if(errEl) errEl.style.display = 'none';

  const book = document.getElementById('ppBook');
  book.innerHTML = '<p class="pp-empty" style="text-align:center;padding:44px 0;">翻開中…</p>';

  const [tasteRes, surpriseRes, memberRes] = await Promise.all([
    sb.rpc('taste_passport', { p_phone: phone }),
    sb.rpc('draw_daily_surprise', { p_phone: phone }),
    sb.rpc('member_area', { p_phone: phone })
  ]);

  if(tasteRes.error || !tasteRes.data || !tasteRes.data.ok){
    book.innerHTML = `<p class="pp-empty" style="text-align:center;padding:30px 0;">查詢失敗，請稍後再試。</p>
      <div style="text-align:center;"><button class="pp-reset" onclick="renderPassportClosed()">重新輸入</button></div>`;
    return;
  }

  ppPhone = phone;
  ppData = tasteRes.data;
  ppSurprise = (surpriseRes.data && surpriseRes.data.ok) ? surpriseRes.data : null;
  ppMember = (memberRes.data && memberRes.data.ok) ? memberRes.data : { orders:[], coupons:[] };
  ppTab = 'surprise';
  renderPassportOpen();
}

function ppTabDef(){
  return [
    { key:'surprise', label:'當日驚喜', icon:'🎁' },
    { key:'region',   label:'產區',    icon:'🌍' },
    { key:'flavor',   label:'風味',    icon:'👃' },
    { key:'roast',    label:'烘焙度',  icon:'🔥' },
    { key:'process',  label:'處理法',  icon:'💧' },
    { key:'member',   label:'會員專區', icon:'👤' }
  ];
}

function switchPassportTab(key){
  ppTab = key;
  renderPassportOpen(true);
}

function renderPassportOpen(animate){
  if(animate === undefined) animate = true;
  const book = document.getElementById('ppBook');
  const defs = ppTabDef();
  const idx = defs.findIndex(t => t.key === ppTab);
  const prevKey = defs[(idx - 1 + defs.length) % defs.length].key;
  const nextKey = defs[(idx + 1) % defs.length].key;

  const tabs = defs.map(t => `
    <div class="pp-tab ${ppTab===t.key?'active':''}" onclick="switchPassportTab('${t.key}')">
      <span class="pp-tab-icon">${t.icon}</span>${t.label}
    </div>`).join('');

  book.innerHTML = `
    <div class="pp-open">
      <div class="pp-tabs">${tabs}</div>
      <div class="pp-page ${animate?'pp-flip':''}"><div class="pp-page-inner">${renderPassportTabContent()}</div></div>
      <div class="pp-nav-row">
        <button class="pp-nav-btn prev" onclick="switchPassportTab('${prevKey}')">‹ 上一頁</button>
        <button class="pp-nav-btn next" onclick="switchPassportTab('${nextKey}')">下一頁 ›</button>
      </div>
      <div class="pp-foot-row">
        <a class="pp-enc" href="origin-encyclopedia.html">看產地百科 →</a>
        <button class="pp-reset" onclick="renderPassportClosed()">換一支電話</button>
      </div>
    </div>`;
}

function renderPassportTabContent(){
  if(!ppData.orders && ppTab !== 'surprise' && ppTab !== 'member'){
    return `<p class="pp-empty">這支號碼還沒有咖啡豆的購買紀錄，先去選豆子逛逛吧。</p>`;
  }
  if(ppTab === 'surprise') return renderSurpriseTab();
  if(ppTab === 'member')   return renderMemberTab();
  return renderStampTab(ppTab);
}

function renderSurpriseTab(){
  let html = '';
  const claims = ppData.newly_claimed || [];
  if(claims.length){
    html += claims.map(c => `
      <div class="pp-celebrate">
        <p class="pp-celebrate-title">🎉 恭喜集滿「${esc(c.goal_name)}」！</p>
        <div class="pp-celebrate-row">
          <span>${c.kind==='discount'
            ? (c.discount_type==='percent' ? c.discount_value+' 折折扣碼' : '折抵 NT$'+c.discount_value+' 折扣碼')
            : '兌換券：'+esc(c.exchange_item)}</span>
          <span class="pp-celebrate-code" onclick="ppCopy('${esc(c.code)}', this)">${esc(c.code)} · 複製</span>
        </div>
      </div>`).join('');
  }

  if(ppSurprise){
    html += `
      <div class="pp-surprise">
        <div class="pp-surprise-icon">${esc(ppSurprise.icon || '☕')}</div>
        <h4 class="pp-surprise-title">${esc(ppSurprise.title)}</h4>
        <p class="pp-surprise-desc">${esc(ppSurprise.description || '')}</p>
        <p class="pp-surprise-tag">${ppSurprise.drawn_before ? '今日已翻閱過這個驚喜' : '今日限定驚喜'}</p>
      </div>`;
  } else {
    html += `<p class="pp-empty" style="text-align:center;">今天還沒有設定驚喜，晚點再回來看看。</p>`;
  }
  return html;
}

const PP_KIND_META = {
  region:  { label:'產區',   color:'var(--pp-stamp-region)'  },
  flavor:  { label:'風味',   color:'var(--pp-stamp-flavor)'  },
  roast:   { label:'烘焙度', color:'var(--pp-stamp-roast)'   },
  process: { label:'處理法', color:'var(--pp-stamp-process)' }
};

function renderStampTab(kind){
  const meta = PP_KIND_META[kind];
  const list = (ppData.tags || []).filter(t => t.kind === kind);

  const picked = new Set();
  Object.keys(qty).forEach(id => (tagMap[id] || []).forEach(t => picked.add(t.name)));

  let html = `<p class="pp-stamp-intro">每喝過一種${meta.label}就會蓋上一枚章，數字是累積次數。</p>`;
  if(!list.length){
    html += `<p class="pp-stamp-empty">還沒有蓋上${meta.label}的章。</p>`;
  } else {
    html += `<div class="pp-stamps">${list.map(t => `
      <div class="pp-stamp ${picked.has(t.name)?'match':''}" style="--stamp-color:${meta.color};">
        <span class="pp-stamp-count">${t.count}</span>
        <span class="pp-stamp-name">${esc(t.name)}</span>
      </div>`).join('')}</div>`;
  }

  const goals = (ppData.goals || []).filter(g => g.scope === 'total' || g.tag_kind === kind);
  if(goals.length){
    html += `<div class="pp-goal">${goals.map(g => `
      <div class="pp-goal-row">
        <div class="pp-goal-name">
          <span>${esc(g.name)}${g.scope==='total' ? '（全部分類）' : ''}</span>
          <b class="${g.completed?'pp-goal-done':''}">${g.progress} / ${g.target}${g.completed ? ' ✓' : ''}</b>
        </div>
        <div class="pp-goal-bar"><div class="pp-goal-bar-fill" style="width:${Math.min(100, g.progress/g.target*100)}%"></div></div>
      </div>`).join('')}</div>`;
  }
  return html;
}

function renderMemberTab(){
  let html = '<div class="pp-member-sec"><div class="pp-member-title">📦 購買紀錄</div>';
  const orders = ppMember.orders || [];
  if(!orders.length){
    html += `<p class="pp-empty">這支電話還沒有訂購紀錄。</p>`;
  } else {
    html += orders.slice(0, 10).map(o => {
      const t = new Date(o.created_at).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      const items = (o.items || []).map(i => `${esc(i.name)} × ${i.qty}`).join('、');
      return `<div class="pp-order-card">
        <div class="pp-order-head"><span>#${esc(o.id)} · ${t}</span>
          <span class="pp-badge ${esc(o.status)}">${esc(o.status)}</span></div>
        <div class="pp-order-items">${items}</div>
        <div class="pp-order-foot"><span>${o.order_source==='counter'?'現場點單':'線上訂購'}</span><span>NT$ ${Number(o.total).toLocaleString('en-US')}</span></div>
      </div>`;
    }).join('');
  }
  html += '</div>';

  html += '<div class="pp-member-sec"><div class="pp-member-title">🎫 我的折扣碼</div>';
  const coupons = ppMember.coupons || [];
  if(!coupons.length){
    html += `<p class="pp-empty">目前沒有折扣碼，集章換獎後會出現在這裡。</p>`;
  } else {
    html += coupons.map(c => {
      const used = c.status === '已使用';
      const desc = c.kind === 'discount'
        ? (c.discount_type === 'percent' ? c.discount_value+' 折' : '折抵 NT$'+c.discount_value)
        : '兌換：'+esc(c.exchange_item || '');
      return `<div class="pp-coupon-card ${used?'used':''}">
        <div>
          <div class="pp-coupon-code">${esc(c.code)}</div>
          <div class="pp-coupon-desc">${desc}${c.expiry ? ' · 效期至 '+c.expiry : ''} · ${used?'已使用':'未使用'}</div>
        </div>
        ${used ? '' : `<button class="pp-copy-btn" onclick="ppCopy('${esc(c.code)}', this)">複製</button>`}
      </div>`;
    }).join('');
  }
  html += '</div>';
  return html;
}

function ppCopy(code, btn){
  if(navigator.clipboard) navigator.clipboard.writeText(code).catch(()=>{});
  if(btn){
    const orig = btn.textContent;
    btn.textContent = '已複製';
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }
}

/* ---------- 豆單 ---------- */
function renderBeans(){
  const el = document.getElementById('beanList');
  if(!products.length){ el.innerHTML = '<div class="empty-note">目前沒有上架中的豆子</div>'; return; }

  const list = products.filter(matchFilters);
  if(!list.length){
    el.innerHTML = `<div class="empty-note">
      沒有符合的豆子。<button class="filter-clear" onclick="clearFilters()">清除篩選看全部</button></div>`;
    return;
  }

  el.innerHTML = list.map(p => {
    const chips = (tagMap[p.id] || [])
      .filter(t => isFilterKind(t.kind))
      .map(t => `<span class="tag ${t.kind}">${esc(t.name)}</span>`).join('');
    return `
    <div class="bean">
      <input type="checkbox" id="cb-${p.id}" ${qty[p.id]?'checked':''}
             onchange="toggleBean('${p.id}', this.checked)">
      <div class="bean-info">
        <div class="bean-top">
          <div class="bean-name">${esc(p.name)}</div>
          <div class="bean-price">NT$ ${p.price}</div>
        </div>
        <div class="bean-meta">${esc(p.meta || '')}</div>
        <div class="bean-desc">${esc(p.description || '')}</div>
        ${chips ? `<div class="bean-tags">${chips}</div>` : ''}
        ${p.origin_country
          ? `<a class="origin-link" href="origin-encyclopedia.html">在產地百科看 ${esc(p.origin_country)} →</a>` : ''}
        <div class="qty-row" id="qtyRow-${p.id}" style="display:${qty[p.id]?'flex':'none'};">
          <div class="qty-btn" onclick="changeQty('${p.id}',-1)">−</div>
          <div class="qty-val" id="qtyVal-${p.id}">${qty[p.id] || 1}</div>
          <div class="qty-btn" onclick="changeQty('${p.id}',1)">＋</div>
        </div>
      </div>
    </div>`;
  }).join('') + (list.length < products.length
    ? `<div class="filter-count">顯示 ${list.length} / ${products.length} 支</div>` : '');
}
function toggleBean(id, checked){
  if(checked){ qty[id] = 1; document.getElementById('qtyRow-'+id).style.display='flex'; }
  else { delete qty[id]; document.getElementById('qtyRow-'+id).style.display='none'; }
  renderSummary();
}
function changeQty(id, d){
  qty[id] = Math.max(1, (qty[id]||1) + d);
  const el = document.getElementById('qtyVal-'+id);
  if(el) el.textContent = qty[id];
  renderSummary();
}

/* ---------- 取貨與付款 ---------- */
function setDelivery(v){
  delivery = v;
  document.querySelectorAll('[data-delivery]').forEach(el =>
    el.classList.toggle('active', el.dataset.delivery === v));
  document.getElementById('addressField').style.display = v === 'delivery' ? 'block' : 'none';
}

function renderPayments(){
  const el = document.getElementById('payList');
  if(!payments.length){ el.innerHTML = '<div class="empty-note">尚未設定付款方式</div>'; return; }
  el.innerHTML = payments.map(p => `
    <div class="choice ${p.id===payMethod?'active':''}" data-pay="${p.id}" onclick="setPay('${p.id}')">
      <span class="dot"></span><span class="choice-name">${esc(p.name)}</span>
    </div>
    <div class="pay-detail ${p.id===payMethod?'show':''}" id="payDetail-${p.id}">
      ${p.bank    ? `<div class="row"><b>銀行</b><span>${esc(p.bank)}</span></div>` : ''}
      ${p.branch  ? `<div class="row"><b>分行</b><span>${esc(p.branch)}</span></div>` : ''}
      ${p.account ? `<div class="row"><b>帳號</b><span>${esc(p.account)}</span></div>` : ''}
      ${p.holder  ? `<div class="row"><b>戶名</b><span>${esc(p.holder)}</span></div>` : ''}
      ${p.qr_image_url ? `<img class="qr" src="${esc(p.qr_image_url)}" alt="${esc(p.qr_caption||'付款 QR Code')}">` : ''}
      ${p.qr_image_url && p.qr_caption ? `<div class="qr-cap">${esc(p.qr_caption)}</div>` : ''}
      ${p.note ? `<div style="margin-top:10px;">${esc(p.note)}</div>` : ''}
    </div>`).join('');
}
function setPay(id){
  payMethod = id;
  document.querySelectorAll('[data-pay]').forEach(el =>
    el.classList.toggle('active', el.dataset.pay === id));
  payments.forEach(p =>
    document.getElementById('payDetail-'+p.id).classList.toggle('show', p.id === id));
}

/* ---------- 優惠券 ---------- */
async function applyCoupon(){
  const code = document.getElementById('couponCode').value.trim();
  const msg = document.getElementById('couponMsg');
  if(!code){ msg.textContent=''; appliedCoupon=null; renderSummary(); return; }

  msg.textContent = '確認中…'; msg.className = 'coupon-msg';
  const { data, error } = await sb.rpc('check_coupon', { p_code: code });

  if(error){
    msg.textContent = '無法確認代碼：' + error.message;
    msg.className = 'coupon-msg err';
    appliedCoupon = null; renderSummary(); return;
  }
  if(!data || !data.ok){
    msg.textContent = (data && data.reason) || '這個代碼無法使用';
    msg.className = 'coupon-msg err';
    appliedCoupon = null; renderSummary(); return;
  }
  appliedCoupon = data;
  msg.textContent = data.kind === 'discount'
    ? `已套用：${data.discount_type === 'percent' ? data.discount_value + ' 折' : '折抵 NT$' + data.discount_value}`
    : `已套用兌換券：${data.exchange_item}`;
  msg.className = 'coupon-msg ok';
  renderSummary();
}

/* ---------- 明細 ---------- */
function subtotalOf(){
  return Object.keys(qty).reduce((s,id) => {
    const p = products.find(x => x.id === id);
    return s + (p ? Number(p.price) * qty[id] : 0);
  }, 0);
}
function discountOf(sub){
  if(!appliedCoupon || appliedCoupon.kind !== 'discount') return 0;
  const raw = appliedCoupon.discount_type === 'percent'
    ? sub * (1 - Number(appliedCoupon.discount_value) / 10)
    : Number(appliedCoupon.discount_value);
  return Math.min(sub, Math.max(0, Math.round(raw)));
}
function renderSummary(){
  const ids = Object.keys(qty);
  const box = document.getElementById('summary');
  if(!ids.length){
    box.innerHTML = '<div class="empty-note">尚未選擇豆子</div>';
    updateCart();
    return;
  }
  const sub = subtotalOf();
  const rows = ids.map(id => {
    const p = products.find(x => x.id === id);
    return `<div class="summary-row"><span>${esc(p.name)} × ${qty[id]}</span><span>NT$ ${Number(p.price)*qty[id]}</span></div>`;
  }).join('');
  let extra = '';
  const dis = discountOf(sub);
  if(dis > 0) extra += `<div class="summary-row" style="color:var(--ok)"><span>優惠券折抵</span><span>− NT$ ${dis}</span></div>`;
  if(appliedCoupon && appliedCoupon.kind === 'exchange')
    extra += `<div class="summary-row" style="color:var(--ok)"><span>兌換品項</span><span>${esc(appliedCoupon.exchange_item)}（免費）</span></div>`;
  box.innerHTML = rows + extra +
    `<div class="summary-row total"><span>應付總額</span><span>NT$ ${(sub - dis).toLocaleString('en-US')}</span></div>`;
  updateCart();
  if(ppData && (ppTab==='region'||ppTab==='flavor'||ppTab==='roast'||ppTab==='process')) renderPassportOpen(false);
}

/* ---------- 送出 ---------- */
async function submitOrder(){
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('submitBtn');
  const ids = Object.keys(qty);
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('address').value.trim();
  const note = document.getElementById('note').value.trim();

  if(!ids.length){ return showErr('請至少選擇一款咖啡豆。'); }
  if(!name || !phone){ return showErr('請填寫姓名與電話，我們才能與你聯繫。'); }
  if(delivery === 'delivery' && !address){ return showErr('宅配需要填寫寄送地址。'); }

  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = '送出中…';

  const { data, error } = await sb.rpc('place_order', {
    p_customer_name: name,
    p_phone: phone,
    p_delivery: delivery,
    p_address: address,
    p_note: note,
    p_payment: payMethod || '',
    p_coupon_code: document.getElementById('couponCode').value.trim(),
    p_items: ids.map(id => ({ product_id: id, qty: qty[id] }))
  });

  btn.disabled = false; btn.textContent = '送出訂購資訊';

  if(error){ return showErr('送出失敗：' + error.message); }
  if(!data || !data.ok){ return showErr((data && data.reason) || '送出失敗，請稍後再試。'); }

  document.getElementById('orderCode').textContent = '#' + data.order_id;
  const pay = payments.find(p => p.id === payMethod);
  document.getElementById('payRemind').innerHTML = pay ? `
    <div style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.1em;
                text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px;">付款方式 · ${esc(pay.name)}</div>
    ${pay.account ? `<div>${esc(pay.bank)}　${esc(pay.account)}<br>戶名：${esc(pay.holder)}</div>` : ''}
    ${pay.note ? `<div style="margin-top:8px;">${esc(pay.note)}</div>` : ''}
    <div style="margin-top:10px;font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--ink);">
      應付金額 NT$ ${data.total}</div>` : '';
  document.getElementById('formView').style.display = 'none';
  document.getElementById('doneView').classList.add('show');
  window.scrollTo({top:0, behavior:'smooth'});
}
function showErr(m){
  const e = document.getElementById('errMsg');
  e.textContent = m; e.style.display = 'block';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '送出訂購資訊';
}

function resetForm(){
  qty = {}; appliedCoupon = null;
  ['custName','custPhone','address','note','couponCode'].forEach(id =>
    document.getElementById(id).value = '');
  document.getElementById('couponMsg').textContent = '';
  document.getElementById('errMsg').style.display = 'none';
  document.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
  document.querySelectorAll('.qty-row').forEach(r => r.style.display = 'none');
  setDelivery('pickup');
  renderSummary();
  document.getElementById('doneView').classList.remove('show');
  document.getElementById('formView').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 浮動購物車 ---------- */
function cartCount(){
  return Object.values(qty).reduce((s,n)=>s+n, 0);
}
function updateCart(){
  const n = cartCount();
  const fab = document.getElementById('cartFab');
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartAmt').textContent = 'NT$ ' + subtotalOf().toLocaleString('en-US');
  fab.classList.toggle('show', n > 0);
  if(n === 0) closeCart();
  renderCart();
}
function renderCart(){
  const ids = Object.keys(qty);
  const box = document.getElementById('cartItems');
  if(!ids.length){ box.innerHTML = '<p class="cart-hint" style="padding:20px 0;">還沒有選擇任何豆子</p>'; }
  else {
    box.innerHTML = ids.map(id => {
      const p = products.find(x => x.id === id);
      if(!p) return '';
      return `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(p.name)}</div>
          <div class="cart-item-meta">${esc(p.meta || '')} · NT$ ${p.price}</div>
          <div class="qty-row" style="margin-top:9px;">
            <div class="qty-btn" onclick="changeQty('${p.id}',-1)">−</div>
            <div class="qty-val">${qty[id]}</div>
            <div class="qty-btn" onclick="changeQty('${p.id}',1)">＋</div>
          </div>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-sub">NT$ ${(Number(p.price)*qty[id]).toLocaleString('en-US')}</div>
          <button class="cart-remove" onclick="removeFromCart('${p.id}')">移除</button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('cartTotal').textContent = 'NT$ ' + subtotalOf().toLocaleString('en-US');
}
function openCart(){
  renderCart();
  document.getElementById('cartBackdrop').classList.add('show');
  document.getElementById('cartPanel').classList.add('show');
}
function closeCart(){
  document.getElementById('cartBackdrop').classList.remove('show');
  document.getElementById('cartPanel').classList.remove('show');
}
function removeFromCart(id){
  delete qty[id];
  const cb = document.getElementById('cb-' + id);
  if(cb) cb.checked = false;
  const row = document.getElementById('qtyRow-' + id);
  if(row) row.style.display = 'none';
  renderSummary();
}
function goToForm(){
  closeCart();
  document.getElementById('custName').scrollIntoView({ behavior:'smooth', block:'center' });
  setTimeout(()=> document.getElementById('custName').focus({ preventScroll:true }), 420);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeCart(); });

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
